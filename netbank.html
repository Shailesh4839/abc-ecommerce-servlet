<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Banking - Secure Payment</title>
    <style type="text/css">
        /* Global Reset & Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Card Styling */
        .payment-container {
            max-width: 450px;
            width: 100%;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Header Layout */
        .payment-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .payment-header h2 {
            font-size: 24px;
            color: #1e3a8a;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .payment-header p {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #1e3a8a;
            letter-spacing: 0.5px;
            padding-left: 2px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background-color: #f8fafc;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        /* Input Focus State */
        .form-group input:focus {
            border-color: #1e3a8a;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1);
        }

        /* Button Layout & Styling */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-submit {
            background-color: #10b981;
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-submit:hover {
            background-color: #059669;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-reset {
            background-color: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
        }

        .btn-reset:hover {
            background-color: #f1f5f9;
            color: #334155;
        }

        /* Footer Link Layout */
        .payment-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .btn-cancel {
            font-size: 14px;
            font-weight: 600;
            color: #ef4444;
            text-decoration: none;
            transition: color 0.2s;
        }

        .btn-cancel:hover {
            color: #dc2626;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="payment-container">
        <div class="payment-header">
            <h2>Secure Net Banking</h2>
            <p>Please enter your payment credential details securely</p>
        </div>

        <form action="bank" method="post">
            
            <div class="form-group">
                <label for="name">Account Holder Name</label>
                <input type="text" id="name" name="name" placeholder="Enter the name on the card" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="cardno">Card Number</label>
                <input type="text" id="cardno" name="cardno" placeholder="Enter your 16-digit card number" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="bankname">Bank Name</label>
                <input type="text" id="bankname" name="bankname" placeholder="Enter your bank name" required autocomplete="off">
            </div>

            <div class="btn-group">
                <input type="submit" class="btn btn-submit" value="Submit Payment">
                <input type="reset" class="btn btn-reset" value="Reset Form">
            </div>

            <div class="payment-footer">
                <a href="welcome.html" class="btn-cancel">Cancel Transaction</a>
            </div>

        </form>
    </div>

</body>
</html>
