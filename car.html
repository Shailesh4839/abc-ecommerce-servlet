<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Shop - Premium UI</title>
    <style>
        /* Base Reset & Variables */
        :root {
            --primary-blue: #1e3a8a;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --success-green: #10b981;
            --accent-glow: rgba(30, 58, 138, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 50px 20px;
        }

        /* Container Card */
        .store-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Top Bar & Title */
        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .store-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-blue);
            letter-spacing: -0.5px;
        }

        .store-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Premium Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Clean Interactive Product Card */
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Card Hover Effects */
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            border-color: var(--primary-blue);
        }

        /* Subtle decorative line on hover */
        .product-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary-blue);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .product-card:hover::after {
            transform: scaleX(1);
        }

        /* Image Display Box */
        .image-wrapper {
            background-color: var(--light-bg);
            width: 100%;
            height: 180px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover .image-wrapper img {
            transform: scale(1.08) rotate(1deg);
        }

        /* Custom Styled Selection Option */
        .custom-checkbox-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px dashed #e2e8f0;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* Standard custom checkbox layout */
        .checkbox-wrapper {
            position: relative;
            display: inline-block;
            width: 22px;
            height: 22px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 100%;
            height: 100%;
            accent-color: var(--primary-blue);
            cursor: pointer;
        }

        /* Sticky Bottom Actions Bar */
        .footer-action-bar {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-action-bar p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-checkout {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
        }

        .btn-checkout:hover {
            background-color: #1e40af;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.3);
        }

        /* Mobile View Adjustments */
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            .store-header { flex-direction: column; align-items: flex-start; gap: 5px; }
            .footer-action-bar { flex-direction: column; gap: 15px; text-align: center; }
            .btn-checkout { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="store-wrapper">
        
        <header class="store-header">
            <div>
                <h1>Cars Shop</h1>
                <p>Select the luxury cars you wish to purchase</p>
            </div>
        </header>
        
        <form method="post" action="cars">
            
            <div class="products-grid">
                
                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/car1.jpg" alt="Porsche">
                    </div>
                    <div class="custom-checkbox-container">
                        <label for="Porsche" class="product-title">Porsche</label>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="Porsche" name="car" value="Porsche">
                        </div>
                    </div>
                </div>

                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/car2.jpg" alt="Lamborghini">
                    </div>
                    <div class="custom-checkbox-container">
                        <label for="Lamborghini" class="product-title">Lamborghini</label>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="Lamborghini" name="car" value="Lamborghini">
                        </div>
                    </div>
                </div>

                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/car3.jpg" alt="Bugatti Veyron">
                    </div>
                    <div class="custom-checkbox-container">
                        <label for="BugattiVeyron" class="product-title">Bugatti Veyron</label>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="BugattiVeyron" name="car" value="Bugatti Veyron">
                        </div>
                    </div>
                </div>

                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/car4.jpg" alt="Spyder">
                    </div>
                    <div class="custom-checkbox-container">
                        <label for="Spyder" class="product-title">Spyder</label>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="Spyder" name="car" value="Spyder">
                        </div>
                    </div>
                </div>

            </div>

            <div class="footer-action-bar">
                <p>Verify your selections before placing the order.</p>
                <input type="submit" name="buy" value="Buy Now" class="btn-checkout">
            </div>

        </form>
    </div>

</body>
</html>
