<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <style>
        /* Modern Base Setup */
        :root {
            --primary-blue: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --input-focus: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Premium Form Card Wrapper */
        .register-container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Form Heading */
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Form Grid Layout */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        /* Inputs & Textarea Styling */
        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="date"],
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        /* Custom Styling for Textarea */
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        /* Radio Group Option */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 4px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-main);
        }

        .radio-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-blue);
            cursor: pointer;
        }

        /* Buttons Layout */
        .btn-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            outline: none;
            text-align: center;
        }

        .btn-submit {
            background-color: var(--primary-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(30, 58, 138, 0.3);
        }

        .btn-reset {
            background-color: #f1f5f9;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
            color: #334155;
        }

        /* Footer Link */
        .form-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .form-footer a {
            color: var(--input-focus);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-footer a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        
        <div class="form-header">
            <h2>Registration</h2>
            <p>Create your account by filling the details below</p>
        </div>

        <form method="post" action="register">
            
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" name="userId" placeholder="Enter First Name" required>
            </div>

            <div class="form-group">
                <label for="t2">Phone Number</label>
                <input type="text" id="t2" name="t2" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label for="repass">Re-enter Password</label>
                <input type="password" id="repass" name="repass" placeholder="Enter password again" required>
            </div>

            <div class="form-group">
                <label for="ta">Address</label>
                <textarea id="ta" name="ta" rows="2" placeholder="Enter Your Address" required></textarea>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" value="Male" name="r1" checked> Male
                    </label>
                    <label class="radio-label">
                        <input type="radio" value="Female" name="r1"> Female
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="tt">Date of Birth</label>
                <input type="date" id="tt" name="tt" required>
            </div>

            <div class="btn-group">
                <input type="submit" value="Register Now" class="btn btn-submit">
                <input type="reset" value="Reset" class="btn btn-reset">
            </div>

            <div class="form-footer">
                <a href="index.html">Already Registered? Login Now</a>
            </div>

        </form>
    </div>

</body>
</html>
